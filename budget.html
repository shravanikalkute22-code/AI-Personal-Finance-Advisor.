{% extends "base.html" %}
{% block content %}
<div class="page-head"><div><p class="eyebrow">PLAN AHEAD</p><h1>Budget</h1></div></div>
<div class="grid2">
<div class="panel"><h3>Create Budget</h3><form method="post">
<label>Category</label><select name="category">{% for c in categories %}<option>{{ c }}</option>{% endfor %}</select>
<label>Budget Amount (₹)</label><input type="number" step="0.01" min="0.01" name="amount" required>
<button class="btn">Add Budget</button></form></div>
<div class="panel"><h3>Budget Plans</h3>
{% for x in records %}<div class="row"><span>{{ x.category }}</span><b>₹{{ "%.2f"|format(x.amount) }}</b></div>{% else %}<p>No budgets created yet.</p>{% endfor %}
</div></div>
{% endblock %}
