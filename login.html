{% extends "base.html" %}
{% block content %}
<div class="auth-card">
<h2>Welcome back</h2><p>Login to your finance dashboard.</p>
<form method="post">
<label>Email</label><input type="email" name="email" required>
<label>Password</label><input type="password" name="password" required>
<button class="btn full">Login</button>
</form>
<p class="center">New user? <a href="{{ url_for('register') }}">Create account</a></p>
</div>
{% endblock %}
